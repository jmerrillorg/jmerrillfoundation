name: Deploy jmerrill.foundation

on:
  workflow_dispatch:
    inputs:
      rollback_reason:
        description: "Rollback-only reason for superseded Foundation SWA deployment"
        required: true
        type: string

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Rollback-Only SWA Deploy

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js rollback site
        run: pnpm build

      - name: Deploy rollback to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'out'
          api_location: ''
          output_location: ''
          skip_app_build: true
